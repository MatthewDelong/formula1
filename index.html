<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>F1 Rules Explorer</title>
    <meta name="description" content="An interactive, explodable 3D Formula 1 car that explains the FIA technical regulations part by part." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage"></div>
    <svg id="callout-svg" aria-hidden="true"></svg>
    <div id="labels"></div>

    <nav id="topbar" class="bar">
      <div class="group" id="presets"></div>
      <div class="group">
        <label class="explode" title="Explode">
          <input id="explode" type="range" min="0" max="1" step="0.001" value="0" aria-label="Explode" />
          <output id="explode-val">0%</output>
        </label>
        <span class="sep"></span>
        <button data-menu="layers-menu" aria-haspopup="true">Layers</button>
        <button data-menu="parts-menu" aria-haspopup="true">Parts</button>
      </div>
    </nav>

    <ul id="key" aria-label="Rule colours"></ul>

    <div class="menu" id="layers-menu" hidden><div class="chips" id="layers"></div></div>
    <div class="menu menu-parts" id="parts-menu" hidden>
      <input id="search" type="search" placeholder="Search parts…" autocomplete="off" />
      <div id="part-list"></div>
      <div class="group-title">Who designs it</div>
      <ul class="legend" id="legend"></ul>
      <details id="overview">
        <summary>Key numbers for 2026</summary>
        <dl id="overview-list"></dl>
      </details>
      <p class="fine">A simplified, non-team-specific interpretation of the FIA 2026 F1 Technical &amp; Sporting Regulations. Figures are representative.</p>
    </div>

    <nav id="bottombar" class="bar">
      <div class="group" id="cams">
        <button data-cam="hero" class="on">3/4</button>
        <button data-cam="side">Side</button>
        <button data-cam="top">Top</button>
        <button data-cam="front">Front</button>
        <button data-cam="rear">Rear</button>
        <button data-cam="under">Under</button>
      </div>
      <span class="sep"></span>
      <div class="group">
        <button id="view-mode" title="Colour parts by who designs them"><span class="long">Rule colours</span><span class="short">Colours</span></button>
        <button id="xray">X-ray</button>
        <button id="dims"><span class="long">Dimensions</span><span class="short">Dims</span></button>
        <button id="spin"><span class="long">Turntable</span><span class="short">Spin</span></button>
        <button id="compound" title="Tyre compound"><i></i><span class="names"></span></button>
      </div>
    </nav>

    <div id="card" class="card" role="dialog" aria-live="polite" hidden></div>

    <div id="loading"><div class="spinner"></div><span>Assembling car…</span></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
